# Everything this script does is described here. Edit this file, not the .ts.
#
# Paths may start with ~ for your home folder. Every phase has an `enabled`
# flag, so you can turn one off without deleting its settings.

# ── 1. Backup ────────────────────────────────────────────────────────────
# Copies your shell config somewhere safe before anything else runs. Each run
# gets its own numbered folder: bak1, bak2, bak3 …
backup:
  enabled: true
  directory: ~/Developer/macos-reset
  prefix: bak
  savePath: true # also write out $PATH, which is easy to lose
  files:
    - ~/.zprofile
    - ~/.zshenv
    - ~/.zshrc
    - ~/.local/bin/env

# ── 2. Inventory (before) ────────────────────────────────────────────────
# A record of what was on the machine, written next to the backups.
# To remove this feature entirely: set enabled to false, or delete both this
# block and inventory.ts — nothing else refers to it.
inventory:
  enabled: true
  when: before # before | after | both
  root: ~
  maxDepth: 3
  showHidden: true
  followSymlinks: false
  topFiles: 25
  topDirs: 50
  outputDirectory: ~/Developer/macos-reset
  outputBasename: inventory
  excludeDirectories:
    - .git
    - node_modules
    - .venv
    - __pycache__
    - Library

# ── 3. Trash ─────────────────────────────────────────────────────────────
# Moves the *contents* of these folders to the Trash. The folders themselves
# are left in place. Nothing happens without --wipe.
trash:
  enabled: true
  targets:
    - ~/Desktop
    - ~/Documents
    - ~/Downloads
    - ~/Movies
    - ~/Music
    - ~/Public
  # .DS_Store files are regenerated by Finder, so these are deleted outright
  # rather than filling the Trash with thousands of them.
  removeDsStore: true
  dsStoreRoot: ~

# ── 4. Scaffold ──────────────────────────────────────────────────────────
# The folders and placeholder files you want on a fresh machine.
scaffold:
  enabled: true
  directories:
    - ~/Developer/gh
    - ~/Developer/local
    - ~/Developer/tmp1
    - ~/Developer/tmp1/p1
    - ~/Developer/macos-reset
  files:
    - ~/Developer/tmp1/tmp1.md
    - ~/Developer/tmp1/tmp2.md
    - ~/Developer/tmp1/tmp.html
    - ~/Developer/tmp1/p1/1.md
    - ~/Developer/tmp1/p1/2.md
    - ~/Developer/tmp1/p1/3.md
    - ~/Desktop/empty.md
    - ~/Developer/empty.md
    - ~/Documents/empty.md
    - ~/Downloads/empty.md

# ── 5. Dock ──────────────────────────────────────────────────────────────
# Spacer tiles are additive — macOS appends one every time you write. The
# script counts what is already there and only tops up the difference, so
# running it twice does not give you four spacers.
dock:
  enabled: true
  spacers: 1
  smallSpacers: 1

# ── 6. Open ──────────────────────────────────────────────────────────────
# Finder windows to leave open at the end.
open:
  enabled: true
  paths:
    - ~/Desktop
    - ~/Developer
    - ~/Documents
    - ~/Downloads

# ── 7. Done ──────────────────────────────────────────────────────────────
sounds:
  enabled: true
  onSuccess: /System/Library/Sounds/Ping.aiff
  onFailure: /System/Library/Sounds/Funk.aiff
