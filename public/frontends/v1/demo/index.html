<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo scripts · Runbook</title>
    <link rel="icon" href="/shared/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/shared/fonts.css" />
    <link rel="stylesheet" href="/v1/styles.css" />
  </head>
  <body data-group="demo">
    <div class="runbook">
      <aside class="rail">
        <header class="rail-head">
          <p class="rail-eyebrow">Script runbook</p>
          <h1 class="rail-title" id="page-title"></h1>
          <p class="rail-lede" id="page-lede"></p>
          <nav class="rail-nav" id="groups" aria-label="Script groups"></nav>
          <nav class="rail-versions" id="versions" aria-label="Frontend version"></nav>
        </header>
        <div class="rail-scroll" id="rail-scroll"></div>
      </aside>

      <main class="console" id="console"></main>
    </div>

    <script type="module" src="/v1/app.js"></script>
  </body>
</html>
