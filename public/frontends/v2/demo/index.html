<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo scripts · Runbook</title>
    <link rel="icon" href="/shared/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/shared/fonts.css" />
    <link rel="stylesheet" href="/v2/styles.css" />
  </head>
  <body data-group="demo">
    <div class="deck">
      <header class="bar">
        <span class="prompt" aria-hidden="true">~/</span>
        <h1 class="bar-title" id="page-title"></h1>
        <nav class="tabs" id="groups" aria-label="Script groups"></nav>
        <div class="bar-spacer"></div>
        <nav class="versions" id="versions" aria-label="Frontend version"></nav>
      </header>

      <section class="picker" aria-labelledby="picker-title">
        <div class="picker-head">
          <h2 id="picker-title">index</h2>
          <p class="picker-lede" id="page-lede"></p>
          <input
            class="filter"
            id="filter"
            type="search"
            placeholder="filter…"
            aria-label="Filter scripts"
          />
        </div>
        <div class="chips" id="chips"></div>
      </section>

      <main class="stage" id="console"></main>
    </div>

    <script type="module" src="/v2/app.js"></script>
  </body>
</html>
